<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 143 104" role="img" aria-label="TPMCS logo">
  <defs>
    <linearGradient id="tpmcsCyan" x1="0.12" y1="0.05" x2="0.86" y2="1">
      <stop offset="0" stop-color="#32d5fb" />
      <stop offset="0.52" stop-color="#00aeef" />
      <stop offset="1" stop-color="#0055aa" />
    </linearGradient>
    <linearGradient id="tpmcsViolet" x1="0.1" y1="0.05" x2="0.9" y2="1">
      <stop offset="0" stop-color="#7b7bff" />
      <stop offset="0.48" stop-color="#4444ff" />
      <stop offset="1" stop-color="#3300aa" />
    </linearGradient>
    <linearGradient id="tpmcsSheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- extruded depth, right segment -->
  <path fill="#1a0d4a" d="M73.5 25.5 L117.5 95.5 L139.7 81.9 L95.7 11.9 Z" />
  <!-- extruded depth, left segment -->
  <path fill="#013354" d="M29.5 95.5 L73.5 25.5 L51.3 11.9 L7.3 81.9 Z" />

  <!-- right chevron -->
  <path fill="url(#tpmcsViolet)" d="M70 22 L114 92 L136.2 78.4 L92.2 8.4 Z" />
  <!-- left chevron, overlaps the right one for the interlocked look -->
  <path fill="url(#tpmcsCyan)" d="M26 92 L70 22 L47.8 8.4 L3.8 78.4 Z" />

  <!-- specular edge along the left chevron -->
  <path d="M47.8 8.4 L3.8 78.4" stroke="url(#tpmcsSheen)" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.6" />
  <!-- light seam where the two segments meet -->
  <path d="M70 22 L92.2 8.4" stroke="url(#tpmcsSheen)" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.45" />
</svg>
