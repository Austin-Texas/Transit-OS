services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: transitos
      POSTGRES_USER: transitos
      POSTGRES_PASSWORD: ${TRANSITOS_DB_PASSWORD:?Set TRANSITOS_DB_PASSWORD in .env}
    volumes:
      - transitos_postgres:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitos -d transitos"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://transitos:${TRANSITOS_DB_PASSWORD}@db:5432/transitos
      NODE_ENV: production
      PUBLIC_ORIGIN: https://transit.hastenload.com
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal:
      edge:
        aliases: [transitos-api]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
networks:
  internal:
    internal: true
  edge:
    external: true
    name: trade-app_default
volumes:
  transitos_postgres:
